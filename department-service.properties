
# Feign logging
logging.level.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# Trace ID
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Console log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name}] [traceId=%X{traceId}] [%thread] %-5level %logger{36} - %msg%n

# File logging (separate per service)
logging.file.name=logs/${spring.application.name}.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name}] [traceId=%X{traceId}] [%thread] %-5level %logger{36} - %msg%n
